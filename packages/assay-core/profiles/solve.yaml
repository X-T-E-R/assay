# Solve archetype: external material is absorbed into project inputs and
# iterative attempt work. It owns a neutral objective model and enables
# iteration by default, without prebuilding a systems core.

extends: base
mode: absorption
modules:
  - iteration

description: Attack one goal that has a measurable success criterion, iterating until the score moves.

dirs:
  - path: problem
    purpose: Task statement, official rules, scoring definition
  - path: intake
    purpose: Raw deliveries that have not been normalized yet
  - path: benchmarks
    purpose: Local proxy evaluation sets
  - path: attempts
    purpose: Sealed attempt packages
  - path: tools
    purpose: Packaging, scoring, and validation scripts
  - path: iterations
    purpose: Goal-attack loops
  - path: iterations/templates
    purpose: Blank iteration plans

dirs_learning: []
dirs_absorption: []

templates:
  - { path: "README.md", templateId: "solve.readme" }
  - { path: "objective.json", templateId: "solve.objective" }
  - { path: "systems/current.json", templateId: "solve.current_attempt" }
  - { path: "problem/README.md", templateId: "solve.problem.readme" }
  - { path: "intake/README.md", templateId: "solve.intake.readme" }
  - { path: "benchmarks/README.md", templateId: "solve.benchmarks.readme" }
  - { path: "attempts/README.md", templateId: "solve.attempts.readme" }
  - { path: "tools/README.md", templateId: "solve.tools.readme" }
  - { path: "iterations/README.md", templateId: "iterations.readme" }
  - { path: "iterations/templates/iteration-plan.md", templateId: "iterations.template.plan" }
