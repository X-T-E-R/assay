__schema: 1
description: Attack one goal that has a measurable success criterion, using bounded attempts until the score moves.
directories:
  - path: problem
    purpose: Task statement, official rules, scoring definition
  - path: intake
    purpose: Raw deliveries that have not been normalized yet
  - path: benchmarks
    purpose: Local proxy evaluation sets
  - path: attempts
    purpose: Sealed attempt packages
  - path: tools
    purpose: Packaging, scoring, and validation scripts
files:
  - path: objective.json
    content: "{\n  \"goal\": \"{{project}}\",\n  \"success_criterion\": \"\"\n}\n"
  - path: problem/README.md
    content: "# problem/\n\nRecord the task, official rules, and scoring definition.\n"
  - path: intake/README.md
    content: "# intake/\n\nRaw deliveries that have not been normalized yet.\n"
  - path: benchmarks/README.md
    content: "# benchmarks/\n\nLocal proxy evaluation sets.\n"
  - path: attempts/README.md
    content: "# attempts/\n\nSealed attempt packages.\n"
  - path: tools/README.md
    content: "# tools/\n\nPackaging, scoring, and validation scripts.\n"