<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Assay: raw material flows in, refined knowledge flows out">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C77B3B"/>
    </marker>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="400" rx="18" fill="#FAF7F2"/>
  <rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="#1E2A3A" stroke-opacity="0.12" stroke-width="2"/>

  <!-- loop arc -->
  <path d="M 1085 158 C 900 38, 320 38, 205 152" fill="none" stroke="#C77B3B" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- left: raw documents -->
  <g stroke="#1E2A3A" stroke-width="3" fill="#FFFFFF">
    <g transform="rotate(-12 195 235)">
      <rect x="150" y="180" width="90" height="110" rx="4"/>
      <line x1="164" y1="204" x2="226" y2="204" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="164" y1="224" x2="226" y2="224" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="164" y1="244" x2="210" y2="244" stroke-opacity="0.35" stroke-width="4"/>
    </g>
    <g transform="rotate(4 245 225)">
      <rect x="200" y="170" width="90" height="110" rx="4"/>
      <line x1="214" y1="194" x2="276" y2="194" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="214" y1="214" x2="276" y2="214" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="214" y1="234" x2="258" y2="234" stroke-opacity="0.35" stroke-width="4"/>
    </g>
    <g transform="rotate(14 285 245)">
      <rect x="240" y="190" width="90" height="110" rx="4"/>
      <line x1="254" y1="214" x2="316" y2="214" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="254" y1="234" x2="316" y2="234" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="254" y1="254" x2="298" y2="254" stroke-opacity="0.35" stroke-width="4"/>
    </g>
  </g>

  <!-- feed path -->
  <path d="M 350 250 C 420 250, 460 245, 512 232" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-opacity="0.55" marker-end="url(#arrow)"/>

  <!-- center: crucible -->
  <g>
    <circle cx="600" cy="196" r="46" fill="#C77B3B" opacity="0.28"/>
    <polygon points="582,150 596,150 589,168" fill="#C77B3B"/>
    <polygon points="606,138 620,142 610,158" fill="#C77B3B"/>
    <polygon points="572,132 584,128 582,146" fill="#C77B3B"/>
    <rect x="528" y="188" width="144" height="18" rx="9" fill="#1E2A3A"/>
    <path d="M 542 206 L 658 206 L 638 300 L 562 300 Z" fill="#1E2A3A"/>
    <path d="M 556 220 L 644 220 L 640 244 L 560 244 Z" fill="#C77B3B" opacity="0.85"/>
  </g>

  <!-- output path -->
  <path d="M 688 232 C 736 245, 752 250, 792 250" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-opacity="0.55" marker-end="url(#arrow)"/>

  <!-- right: refined records -->
  <g stroke="#1E2A3A" stroke-width="3" fill="#FFFFFF">
    <rect x="800" y="176" width="104" height="128" rx="8"/>
    <rect x="816" y="194" width="40" height="10" rx="5" fill="#C77B3B" stroke="none"/>
    <line x1="816" y1="222" x2="888" y2="222" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="816" y1="242" x2="888" y2="242" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="816" y1="262" x2="872" y2="262" stroke-opacity="0.35" stroke-width="4"/>
    <rect x="920" y="176" width="104" height="128" rx="8"/>
    <rect x="936" y="194" width="40" height="10" rx="5" fill="#C77B3B" stroke="none"/>
    <line x1="936" y1="222" x2="1008" y2="222" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="936" y1="242" x2="1008" y2="242" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="936" y1="262" x2="992" y2="262" stroke-opacity="0.35" stroke-width="4"/>
    <rect x="1040" y="176" width="104" height="128" rx="8"/>
    <rect x="1056" y="194" width="40" height="10" rx="5" fill="#C77B3B" stroke="none"/>
    <line x1="1056" y1="222" x2="1128" y2="222" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="1056" y1="242" x2="1128" y2="242" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="1056" y1="262" x2="1112" y2="262" stroke-opacity="0.35" stroke-width="4"/>
  </g>

  <!-- station labels -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="21" letter-spacing="5" fill="#1E2A3A" opacity="0.8" text-anchor="middle">
    <text x="238" y="352">OBSERVE</text>
    <text x="600" y="352">ASSAY</text>
    <text x="972" y="352">REMEMBER</text>
  </g>
</svg>
