<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Assay — Study many. Build your own.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C77B3B"/>
    </marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E2A3A"/>
    </marker>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" rx="18" fill="#FAF7F2"/>
  <rect x="1.5" y="1.5" width="1277" height="637" rx="16.5" fill="none" stroke="#1E2A3A" stroke-opacity="0.12" stroke-width="3"/>

  <!-- left: wordmark block -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="88" y="266" font-size="148" fill="#1E2A3A" letter-spacing="1">Assay</text>
    <rect x="94" y="308" width="64" height="8" rx="4" fill="#C77B3B"/>
    <text x="92" y="374" font-size="38" font-style="italic" fill="#1E2A3A">Study many. Build your own.</text>
    <text x="94" y="460" font-size="19" letter-spacing="2.5" fill="#1E2A3A" opacity="0.72">ASSAY /&#x259;&#x2C8;se&#x26A;/ &#x2014; TO ANALYZE AN ORE</text>
    <text x="94" y="494" font-size="19" letter-spacing="2.5" fill="#1E2A3A" opacity="0.72">AND DETERMINE WHAT IT IS MADE OF.</text>
  </g>

  <!-- right motif -->
  <g transform="translate(15 18)">
  <g transform="translate(945 330) scale(1.05) translate(-945 -330)">

  <!-- right: loop arc -->
  <path d="M 1158 208 C 1010 92, 800 96, 698 232" fill="none" stroke="#C77B3B" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- right: raw fragments -->
  <g stroke="#1E2A3A" stroke-width="3" fill="#FFFFFF">
    <g transform="rotate(-11 668 318)">
      <rect x="623" y="263" width="90" height="110" rx="4"/>
      <line x1="637" y1="287" x2="699" y2="287" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="637" y1="307" x2="699" y2="307" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="637" y1="327" x2="683" y2="327" stroke-opacity="0.35" stroke-width="4"/>
    </g>
    <g transform="rotate(7 748 328)">
      <rect x="703" y="273" width="90" height="110" rx="4"/>
      <line x1="717" y1="297" x2="779" y2="297" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="717" y1="317" x2="779" y2="317" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="717" y1="337" x2="761" y2="337" stroke-opacity="0.35" stroke-width="4"/>
    </g>
  </g>

  <!-- feed path -->
  <path d="M 806 352 C 832 344, 846 330, 858 314" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-opacity="0.55" marker-end="url(#arrowInk)"/>

  <!-- crucible (hero motif, scaled 1.15) -->
  <g transform="translate(255 45) scale(1.15)">
    <circle cx="600" cy="196" r="50" fill="#C77B3B" opacity="0.28"/>
    <polygon points="582,150 596,150 589,168" fill="#C77B3B"/>
    <polygon points="606,138 620,142 610,158" fill="#C77B3B"/>
    <polygon points="572,132 584,128 582,146" fill="#C77B3B"/>
    <rect x="528" y="188" width="144" height="18" rx="9" fill="#1E2A3A"/>
    <path d="M 542 206 L 658 206 L 638 300 L 562 300 Z" fill="#1E2A3A"/>
    <path d="M 556 220 L 644 220 L 640 244 L 560 244 Z" fill="#C77B3B" opacity="0.85"/>
  </g>

  <!-- output path -->
  <path d="M 1036 314 C 1056 322, 1066 330, 1078 340" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-opacity="0.55" marker-end="url(#arrowInk)"/>

  <!-- right: refined cards -->
  <g stroke="#1E2A3A" stroke-width="3" fill="#FFFFFF">
    <rect x="1116" y="286" width="104" height="128" rx="8"/>
    <rect x="1092" y="262" width="104" height="128" rx="8"/>
    <rect x="1108" y="280" width="40" height="10" rx="5" fill="#C77B3B" stroke="none"/>
    <line x1="1108" y1="308" x2="1180" y2="308" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="1108" y1="328" x2="1180" y2="328" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="1108" y1="348" x2="1164" y2="348" stroke-opacity="0.35" stroke-width="4"/>
  </g>
  </g>
  </g>
</svg>
