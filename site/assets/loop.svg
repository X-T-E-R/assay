<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="The evidence loop: sources flow into analyses, analyses branch into systems and knowledge, and knowledge feeds new sources">
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C77B3B"/>
    </marker>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="520" rx="18" fill="#FAF7F2"/>
  <rect x="1" y="1" width="1198" height="518" rx="17" fill="none" stroke="#1E2A3A" stroke-opacity="0.12" stroke-width="2"/>

  <!-- return arc: knowledge feeds the next observation -->
  <path d="M 858 412 C 1050 400, 1160 250, 1085 145 C 990 15, 400 18, 260 128 C 225 158, 205 184, 197 220"
        fill="none" stroke="#C77B3B" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#loop-arrow)"/>

  <!-- station 1: sources (tilted raw documents, same hand as hero.svg) -->
  <g transform="translate(10 130) scale(0.75)" stroke="#1E2A3A" stroke-width="3" fill="#FFFFFF">
    <g transform="rotate(-12 195 235)">
      <rect x="150" y="180" width="90" height="110" rx="4"/>
      <line x1="164" y1="204" x2="226" y2="204" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="164" y1="224" x2="226" y2="224" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="164" y1="244" x2="210" y2="244" stroke-opacity="0.35" stroke-width="4"/>
    </g>
    <g transform="rotate(4 245 225)">
      <rect x="200" y="170" width="90" height="110" rx="4"/>
      <line x1="214" y1="194" x2="276" y2="194" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="214" y1="214" x2="276" y2="214" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="214" y1="234" x2="258" y2="234" stroke-opacity="0.35" stroke-width="4"/>
    </g>
    <g transform="rotate(14 285 245)">
      <rect x="240" y="190" width="90" height="110" rx="4"/>
      <line x1="254" y1="214" x2="316" y2="214" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="254" y1="234" x2="316" y2="234" stroke-opacity="0.35" stroke-width="4"/>
      <line x1="254" y1="254" x2="298" y2="254" stroke-opacity="0.35" stroke-width="4"/>
    </g>
  </g>

  <!-- feed: sources to analyses -->
  <path d="M 275 290 C 330 290, 370 290, 412 290" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-opacity="0.55" marker-end="url(#loop-arrow)"/>

  <!-- station 2: analyses (document under the magnifier) -->
  <g stroke="#1E2A3A" stroke-width="3" fill="#FFFFFF">
    <rect x="430" y="225" width="95" height="125" rx="6"/>
    <line x1="446" y1="252" x2="509" y2="252" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="446" y1="274" x2="509" y2="274" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="446" y1="296" x2="494" y2="296" stroke-opacity="0.35" stroke-width="4"/>
    <circle cx="545" cy="335" r="22"/>
    <circle cx="545" cy="335" r="7" fill="#C77B3B" stroke="none" opacity="0.85"/>
    <line x1="561" y1="351" x2="580" y2="370" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- fork: analyses to systems -->
  <path d="M 545 232 C 640 192, 690 188, 736 186" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-opacity="0.55" marker-end="url(#loop-arrow)"/>
  <!-- fork: analyses to knowledge -->
  <path d="M 552 350 C 640 395, 690 405, 738 410" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-opacity="0.55" marker-end="url(#loop-arrow)"/>

  <!-- station 3: systems (registered stack) -->
  <g stroke="#1E2A3A" stroke-width="3" fill="#FFFFFF">
    <rect x="772" y="140" width="96" height="64" rx="8"/>
    <rect x="758" y="158" width="96" height="64" rx="8"/>
    <rect x="824" y="170" width="20" height="10" rx="5" fill="#C77B3B" stroke="none"/>
    <line x1="772" y1="194" x2="812" y2="194" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="772" y1="208" x2="830" y2="208" stroke-opacity="0.35" stroke-width="4"/>
  </g>

  <!-- station 4: knowledge (kept record with copper tab) -->
  <g stroke="#1E2A3A" stroke-width="3" fill="#FFFFFF">
    <rect x="762" y="352" width="96" height="120" rx="8"/>
    <rect x="778" y="352" width="26" height="14" rx="4" fill="#C77B3B" stroke="none"/>
    <line x1="778" y1="386" x2="842" y2="386" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="778" y1="408" x2="842" y2="408" stroke-opacity="0.35" stroke-width="4"/>
    <line x1="778" y1="430" x2="826" y2="430" stroke-opacity="0.35" stroke-width="4"/>
  </g>

  <!-- directory labels -->
  <g font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="19" fill="#1E2A3A" opacity="0.75" text-anchor="middle">
    <text x="190" y="200">sources/</text>
    <text x="480" y="200">analyses/</text>
    <text x="810" y="118">systems/</text>
    <text x="810" y="336">knowledge/</text>
  </g>

  <!-- station verbs -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="5" fill="#1E2A3A" opacity="0.8" text-anchor="middle">
    <text x="190" y="408">OBSERVE</text>
    <text x="480" y="408">INTERPRET</text>
    <text x="810" y="262">BUILD</text>
    <text x="810" y="508">REMEMBER</text>
  </g>
</svg>
